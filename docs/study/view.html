<html lang="ko">
<head>
<meta charset="utf-8">

<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>스터디 · 부동산 스터디</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="../assets/site.css?v=11221820">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="../assets/config.js?v=11221820"></script>
<script src="../assets/plaza-db.js?v=11221820"></script>
<script src="../assets/site.js?v=11221820"></script>
</head>
<body data-root="../" style="overflow:hidden">
<div id="page" class="reader"><p class="crumb">불러오는 중...</p></div>
<script>
Site.start(async acc => {
  if (acc.study === false) return Site.denied('스터디 통합본');
  const id = new URLSearchParams(location.search).get('id') || '';
  const d = await PlazaDB.db.doc('study/' + id).get();
  if (!d.exists) return '<div class="shell"><p class="crumb"><a href="./">스터디 통합본</a></p><div class="box">이 스터디를 찾지 못했습니다.</div></div>';
  const s = d.data(); document.title = s.title + ' · 부동산 스터디';
  setTimeout(() => { const f = document.getElementById('doc'); if (f) f.srcdoc = s.html; }, 0);
  return '<iframe id="doc" title="' + Site.esc(s.title) + '"></iframe>';
});
</script>
</body>
</html>
