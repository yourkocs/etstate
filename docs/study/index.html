<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<script src="../assets/kakao-out.js?v=11221820"></script>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>스터디 통합본 · 부동산 스터디</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="../assets/site.css?v=11221820">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="../assets/config.js?v=11221820"></script>
<script src="../assets/plaza-db.js?v=11221820"></script>
<script src="../assets/site.js?v=11221820"></script>
</head>
<body data-root="../">
<div class="shell" id="page"><p class="crumb">불러오는 중...</p></div>
<script>
Site.start(async acc => {
  if (acc.study === false) return Site.denied('스터디 통합본');
  const rows = await PlazaDB.db.collection('study').list('path,data->title,data->desc,data->order,updated_at');
  rows.sort((a, b) => (a.order || 99) - (b.order || 99));
  const day = t => t ? new Date(t).toLocaleDateString('ko-KR', { month: 'long', day: 'numeric' }) + ' 수정' : '';
  return '<p class="crumb"><a href="../">처음</a> / 스터디 통합본</p><h1>스터디 통합본</h1><p class="lead">강의별로 정리한 노트입니다. 체크 표시는 각자 기기에 따로 저장됩니다.</p>' +
    (rows.length ? '<ul class="entries">' + rows.map(r => '<li><a href="view.html?id=' + encodeURIComponent(r.path.split('/').pop()) + '"><span class="t">' + Site.esc(r.title || '') + '</span><span class="d">' + Site.esc(r.desc || '') + '</span><span class="n">' + day(r.updated_at) + '</span></a></li>').join('') + '</ul>'
      : '<div class="box">아직 올라온 스터디가 없습니다.</div>');
});
</script>
</body>
</html>
