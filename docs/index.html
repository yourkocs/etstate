<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<script src="./assets/kakao-out.js?v=11221750"></script>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>부동산 스터디</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="./assets/site.css?v=11221750">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="./assets/config.js?v=11221750"></script>
<script src="./assets/plaza-db.js?v=11221750"></script>
<script src="./assets/site.js?v=11221750"></script>
</head>
<body data-root="./">
<div class="shell" id="page"><p class="crumb">불러오는 중...</p></div>
<script>
Site.start(async acc => {
  const db = PlazaDB.db, n = { study: 0, review: 0, visit: 0, bid: 0 }, canS = acc.study !== false, canP = acc.plaza !== false;
  try {
    const [st, pr] = await Promise.all([canS ? db.collection('study').list('path') : [], canP ? db.collection('props').list('path,data->stage') : []]);
    n.study = st.length; pr.forEach(r => { if (r.stage in n) n[r.stage]++; });
  } catch (_) {}
  let adminLink = '';
  if (acc.admin) { let pn = null; try { pn = await PlazaDB.pendingList(); } catch (_) {} adminLink = '<p class="adminlink"><a href="members/">멤버 관리' + (pn && pn.length ? ' · 가입 신청 ' + pn.length + '명' : '') + ' →</a></p>'; }
  const go = '<span class="go" aria-hidden="true">→</span>';
  return '<h1>어디로 갈까요?</h1><p class="lead">공부한 내용과 같이 보는 물건을 한곳에 모았습니다.</p>' +
    '<ul class="entries boxed">' +
    (!canS ? '' : '<li><a href="study/"><span class="t">스터디 통합본</span><span class="d">강의 노트와 체크리스트, 계산기</span>' + go + '<span class="n">노트 ' + n.study + '개</span></a></li>') +
    (!canP ? '' : '<li><a href="plaza/"><span class="t">부동산광장</span><span class="d">추천 물건, 같이 검토, 임장과 입찰 기록 · 매주 월·목 아침 새 물건 업데이트</span>' + go + '<span class="n">검토 ' + n.review + ' · 임장 ' + n.visit + ' · 입찰 ' + n.bid + '</span></a></li>') +
    '</ul>' + (canS || canP ? '' : '<div class="box">아직 볼 수 있는 메뉴가 없습니다. 관리자에게 권한을 요청해 주세요.</div>') + adminLink + '<p class="foot">로그인한 멤버에게만 내용이 보입니다.</p>';
});
</script>
</body>
</html>
