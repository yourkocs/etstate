<script>
(function(){
const TABS=[['rec','오늘 추천'],['review','광장'],['visit','임장'],['bid','입찰·계약'],['follow','추적'],['prefs','내 조건']];

function subBar(items){ if(S.use!=='com') return ''; const c={}; items.filter(p=>useOf(p)==='com').forEach(p=>{const k=subOf(p); c[k]=(c[k]||0)+1;}); const tot=Object.values(c).reduce((a,b)=>a+b,0);
  const keys=SUBS.concat(Object.keys(c).filter(k=>!SUBS.includes(k))); if(S.sub!=='all'&&!keys.includes(S.sub)) keys.push(S.sub);

   '<dl class="kv"><div><dt>용도지역</dt><dd>'+esc(p.zone||'미확인')+'</dd></div><div><dt>지목</dt><dd>'+esc(p.jimok||'-')+'</dd></div><div><dt>지번 주소</dt><dd>'+esc(p.lot||'-')+'</dd></div></dl>'+
   '<div class="row">'+(p.pnu?a('https://www.eum.go.kr/web/ar/lu/luLandDet.jsp?mode=search&selGbn=umd&isNoScr=script&pnu='+encodeURIComponent(p.pnu),'토지이음 (토지이용계획·도면)'):'')+(q?a('https://map.kakao.com/?q='+q,'카카오맵')+a('https://map.naver.com/p/search/'+q,'네이버지도'):'')+(p.hid?a('https://www.hauction.co.kr/search/auction/'+encodeURIComponent(p.hid),'행크옥션 상세'):'')+'</div>'+
   '<p class="sub">지적편집도는 카카오맵이나 네이버지도에서 지도 종류를 "지적편집도"로 바꾸면 색으로 보입니다. 용도지역 글자는 토지이음에서 읽어 온 값입니다.</p></section>'; }

function npl(p){

  const v=below&&short?['크다','crit']:short?['중간','warn']:below?['작다','']:['없음',''];

}

  im.onerror=()=>{ URL.revokeObjectURL(u); rej(new Error('read')); }; im.src=u; }); }

function openProp(id){ S.open=id; S.editing=false; S.comments=[]; S.photos=[]; S.viewPhoto=null; S.upMsg=''; if(unsubC){unsubC();unsubC=null;} if(unsubP){unsubP();unsubP=null;}
  if(db&&id){ unsubP=db.collection('props/'+id+'/photos').onSnapshot(s=>{S.photos=s.docs.map(d=>Object.assign({id:d.id},d.data())).sort((a,b)=>(a.at||0)-(b.at||0));names(S.photos.map(c=>c.uid));render();},()=>{}); }
  if(db&&id){ unsubC=db.collection('props/'+id+'/comments').onSnapshot(s=>{S.comments=s.docs.map(d=>Object.assign({id:d.id},d.data()));names(S.comments.map(c=>c.uid));render();},()=>{}); }
  render(true); window.scrollTo(0,0); }
const val=id=>{const e=$(id);return e?e.value.trim():'';}; const num=id=>{const v=parseFloat(val(id));return isNaN(v)?0:v;};
document.addEventListener('click',e=>{
  const phd=e.target.closest('[data-phdel]'); if(phd){ const k=phd.dataset.phdel; if(phd.dataset.sure!=='1'){ phd.dataset.sure='1'; phd.textContent='한 번 더 누르면 삭제됩니다'; return; } S.viewPhoto=null; if(db){ db.doc('props/'+S.open+'/photos/'+k).delete().catch(fail); } else { S.photos=S.photos.filter(x=>x.id!==k); } return render(true); }
  const phb=e.target.closest('[data-ph]'); if(phb){ S.viewPhoto=phb.dataset.ph||null; return render(true); }
  const rg=e.target.closest('[data-reg]'); if(rg){ const i=$('p-regions'), k=rg.dataset.reg; let a=i.value.split(/[,\s]+/).filter(Boolean); a=a.includes(k)?a.filter(x=>x!==k):a.concat([k]); i.value=a.join(', '); rg.setAttribute('aria-pressed',a.includes(k)); return; }
  const gb=e.target.closest('[data-guide]'); if(gb){ const a=gb.dataset.guide; if(a==='skip') guideEnd(); else if(a==='open') guideGo(0); else guideGo(gstep+(a==='next'?1:-1)); return; }
  const ub=e.target.closest('[data-use]'); const kb=e.target.closest('[data-skip]'); if(kb){ const r=S.recs.find(x=>x.id===kb.dataset.skip); if(r){ const v=!(r.skip||{})[S.me]; if(db){ db.doc('recs/'+r.id).update({skip:{[S.me]:v}}).catch(fail); } else { r.skip=Object.assign({},r.skip,{[S.me]:v}); render(true); } } return; }
  const sb=e.target.closest('[data-sub]'); if(sb){ S.sub=sb.dataset.sub; return render(true); }
  if(ub){ S.use=ub.dataset.use; S.sub='all'; try{localStorage.setItem('use-tab',S.use);}catch(_){ } return render(true); }
  const t=e.target.closest('[data-tab],[data-open],[data-act],[data-track],[data-vote],[data-join],[data-result],[data-rec],[data-outcome]'); if(!t) return;
  const id=S.open,p=id&&S.props[id]; const d=t.dataset;
  if(d.tab){ S.tab=d.tab; S.adding=false; openProp(null); try{history.replaceState(null,'','#'+d.tab);}catch(_){} return; }
  if(d.open) return openProp(d.open);
  if(d.rec){ const r=S.recs.find(x=>x.id===d.rec); if(r){ const c=Object.assign({},r); delete c.id; delete c.example; delete c.src; c.source='추천'; c.deal='경매'; createProp(c);} return; }
  if(d.track) return upd(id,{track:d.track});
  if(d.vote) return upd(id,{approvals:{[S.me||'me']:d.vote}});
  if(d.join) return upd(id,{bid:{join:d.join}});
  if(d.result) return upd(id,{bid:{result:d.result}});
  if(d.outcome) return upd(id,{outcome:d.outcome});
  switch(d.act){
    case 'skipped': S.showSkipped=!S.showSkipped; return render(true);
    case 'add': S.adding=!S.adding; return render(true);
    case 'cancel': S.adding=false; S.editing=false; return render(true);
    case 'edit': S.editing=true; return render(true);
    case 'back': return openProp(null);
    case 'to-visit': upd(id,{stage:'visit'}); S.tab='visit'; return openProp(null);
    case 'to-bid': upd(id,{stage:'bid'}); S.tab='bid'; return openProp(null);
    case 'pass': upd(id,{stage:'pass',outcome:'reviewed'}); S.tab='follow'; return openProp(null);
    case 'close': upd(id,{stage:'done',outcome:(p.bid||{}).result==='won'?'acquired':'reviewed'}); S.tab='follow'; return openProp(null);
    case 'next-round': { const hist=(p.history||[]).concat([{saleDate:p.saleDate||'',minPrice:p.minPrice||0,result:'유찰'}]);
      upd(id,{stage:'review',history:hist,minPrice:num('nx-min')||p.minPrice,saleDate:val('nx-date'),fails:(+p.fails||0)+1,approvals:Object.fromEntries(Object.keys(p.approvals||{}).map(k=>[k,''])),commented:Object.fromEntries(Object.keys(p.commented||{}).map(k=>[k,false])),bid:{join:'',result:'',ourBid:0,winPrice:0}}); S.tab='review'; return openProp(null); }
  }
});
document.addEventListener('change',e=>{ const t=e.target,id=S.open;
  if(t.id==='photo-in'){ const f=[...(t.files||[])]; t.value=''; if(!f.length) return; if(!id||!S.props[id]){ S.err='물건을 연 상태에서 사진을 추가해 주세요.'; return render(true); } addPhotos(f); return; }
  if(!id||!S.props[id]) return;
  if(t.dataset.chk) return upd(id,{checks:{[t.dataset.chk]:t.checked}});
  if(t.dataset.save) return upd(id,{[t.dataset.save]:t.type==='number'?(parseFloat(t.value)||0):t.value});
  if(t.dataset.bid) return upd(id,{bid:{[t.dataset.bid]:t.type==='number'?(parseFloat(t.value)||0):t.value}});
});
document.addEventListener('submit',e=>{ e.preventDefault(); const k=e.target.dataset.form;
  if(k==='prop'){ if(!val('f-caseNo')){S.err='사건번호나 물건 이름을 입력해 주세요.';return render(true);}
    const d={deal:val('f-deal'),caseNo:val('f-caseNo'),court:val('f-court'),addr:val('f-addr'),type:val('f-type'),appraisal:num('f-appraisal'),minPrice:num('f-minPrice'),claim:num('f-claim'),maxLien:num('f-maxLien'),creditor:val('f-creditor'),fails:num('f-fails'),saleDate:val('f-saleDate'),amc:$('f-amc').checked,kb:num('f-kb'),lot:val('f-lot'),zone:val('f-zone'),flags:$('f-flags').value.split('\n').map(x=>x.trim()).filter(Boolean)};
    if(S.open){ S.editing=false; upd(S.open,d); render(true);} else { d.source='직접'; createProp(d);} }
  if(k==='cmt'){ const text=val('c-text'); if(!text) return; addComment(S.open,{uid:S.me||'me',angle:val('c-angle'),text,at:Date.now()}); upd(S.open,{commented:{[S.me||'me']:true}}); $('c-text').value=''; }
  if(k==='val'){ const pr=num('tv-price'); if(!pr){S.err='가치를 만원 단위로 입력해 주세요.';return render(true);} const p=S.props[S.open]; upd(S.open,{values:(p.values||[]).concat([{date:val('tv-date')||today(),price:pr,note:val('tv-note')}])}); if(db) render(true); }
  if(k==='name'){ return saveName(val('my-name')); }
  if(k==='prefs'){ if($('p-name')&&val('p-name')&&val('p-name')!==(S.mnames[S.me]||'')) saveName(val('p-name')); savePrefs({regions:val('p-regions'),maxPrice:num('p-max'),minFails:num('p-fails'),count:num('p-count')||10,types:[...document.querySelectorAll('[data-ptype]:checked')].map(x=>x.dataset.ptype),nplOnly:$('p-npl').checked,amcOnly:$('p-amc').checked,mineOnly:$('p-mine').checked}); S.err=''; S.tab='rec'; render(true); }
});
(function(){ const inp=$('photo-in'); if(!inp) return; let opened=false; const mark=()=>{opened=true;};
  window.addEventListener('blur',mark); document.addEventListener('visibilitychange',mark); inp.addEventListener('change',mark); inp.addEventListener('cancel',mark);
  inp.addEventListener('click',()=>{ opened=false; setTimeout(()=>{ if(!opened&&S.open){ S.upMsg='이 앱에서는 사진 선택 창이 열리지 않는 것 같습니다. 폰의 크롬이나 사파리 브라우저에서 이 화면을 열어 올리거나, Claude 채팅에 사진과 물건 이름을 보내 주세요.'; render(true); const b=document.querySelector('.phgrid,.card h3'); } },2500); }); })();
document.addEventListener('focusout',()=>{ if(dirty) setTimeout(()=>render(),50); });


/* ---------- 로그인과 멤버 연결 (별도 사이트용) ---------- */
function loginView(msg,signedIn){ S.ready=true; S.gate=true; gstep=-1; drawGuide(); $('nav').innerHTML=''; $('who').innerHTML='';
  $('app').innerHTML='<section class="card"><h2>부동산광장 로그인</h2>'+(msg?'<div class="alert">'+esc(msg)+'</div>':'')+
   (signedIn?'<div class="row"><button class="btn" data-login="out">다른 이메일로 로그인</button></div>':
   '<p class="sub">이메일을 넣으면 로그인 링크가 옵니다. 메일의 링크를 이 폰에서 누르면 들어와지고, 로그인은 계속 유지됩니다.</p><form data-login="form" style="display:flex;flex-direction:column;gap:10px"><label class="f">이메일<input id="lg-email" type="email" autocomplete="email" required placeholder="name@gmail.com" style="font:inherit;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--fg)"></label><button class="btn pri" type="submit">로그인 링크 받기</button><p class="sub" id="lg-msg" role="status"></p></form>')+'</section>'; }
document.addEventListener('submit',async e=>{ const f=e.target.closest('[data-login="form"]'); if(!f) return; e.preventDefault(); e.stopImmediatePropagation(); const m=$('lg-msg'), v=$('lg-email').value.trim(); if(!v) return; m.textContent='보내는 중...';
  try{ await PlazaDB.sendLink(v); m.textContent=v+'로 로그인 링크를 보냈습니다. 메일함(스팸함 포함)을 확인해 주세요.'; }catch(err){ m.textContent='보내지 못했습니다. '+((err&&err.message)||'')+' (메일은 1시간에 몇 통만 보낼 수 있어 잠시 뒤 다시 시도해 주세요)'; } },true);
document.addEventListener('click',async e=>{ const b=e.target.closest('[data-login]'); if(!b||b.tagName==='FORM') return; const a=b.dataset.login;
  if(a==='out'){ e.stopImmediatePropagation(); return PlazaDB.signOut(); }
  if(a==='claim'||a==='new'){ e.stopImmediatePropagation(); const id=a==='new'?('u_'+String(S.authUid).replace(/-/g,'').slice(0,16)):b.dataset.id;
    const cur=await db.doc('members/'+id).get(); const au=((cur.exists&&cur.data().auth)||[]).filter(x=>x!==S.authUid).concat([S.authUid]);
    await db.doc('members/'+id).update(Object.assign({auth:au,email:S.email},cur.exists?{}:{joinedAt:Date.now()})); location.reload(); }
  if(a==='add'){ e.stopImmediatePropagation(); const i=$('al-email'); const v=i&&i.value.trim(); if(!v) return; try{ await PlazaDB.allowAdd(v); i.value=''; loadAllow(); }catch(err){ S.err='추가하지 못했습니다. '+((err&&err.message)||''); render(true); } }
  if(a==='del'){ e.stopImmediatePropagation(); if(b.dataset.sure!=='1'){ b.dataset.sure='1'; b.textContent='한 번 더 누르면 삭제'; return; } try{ await PlazaDB.allowRemove(b.dataset.email); loadAllow(); }catch(err){ S.err='삭제하지 못했습니다.'; render(true); } }
},true);
async function whoAmI(acc){ S.authUid=acc.uid; const s=await new Promise((res,rej)=>{ const un=db.collection('members').onSnapshot(x=>{ un(); res(x); },rej); });
  const all=s.docs.map(d=>Object.assign({id:d.id},d.data()||{})); const mine=all.find(m=>(m.auth||[]).includes(acc.uid)); if(mine) return mine.id;
  const free=all.filter(m=>!(m.auth||[]).length);
  if(!free.length){ const id='u_'+String(acc.uid).replace(/-/g,'').slice(0,16); await db.doc('members/'+id).update({auth:[acc.uid],email:acc.email,joinedAt:Date.now()}); return id; }
  S.ready=true; S.gate=true; gstep=-1; drawGuide(); $('nav').innerHTML='';
  $('app').innerHTML='<section class="card"><h2>처음 오셨네요</h2><p class="sub">예전 부동산광장(Claude 화면)에서 쓰던 멤버라면 내 이름을 눌러 주세요. 그동안 남긴 의견·투표·조건이 그대로 이어집니다.</p>'+
    free.map(m=>'<button class="rq" data-login="claim" data-id="'+esc(m.id)+'"><span><b>'+esc(m.name||'이름 없는 멤버')+'</b>'+(m.regions?' · '+esc(m.regions):'')+'</span><span class="go">나예요</span></button>').join('')+
    '<button class="btn" data-login="new">목록에 없어요, 새로 시작</button></section>'; return null; }
async function loadAllow(){ try{ S.allow=await PlazaDB.allowList(); }catch(_){ S.allow=[]; } render(true); }
function accountBox(){ if(!window.PlazaDB||!S.live) return '';
  let h='<section class="card"><div class="row between"><h3>내 계정</h3><button class="btn" data-login="out">로그아웃</button></div><p class="sub">'+esc(S.email||'')+(S.admin?' · 관리자':'')+'</p>';
  if(S.admin){ if(!S.allow){ S.allow=[]; loadAllow(); }
    h+='<h3>로그인 허용 이메일</h3><p class="sub">여기 등록된 이메일만 들어올 수 있습니다. 멤버 이메일을 추가한 뒤 사이트 주소를 보내 주세요.</p>'+
      S.allow.map(a=>'<div class="row between"><span>'+esc(a.email)+(a.admin?' <span class="pill acc">관리자</span>':'')+'</span>'+(a.email===S.email?'':'<button class="btn danger" data-login="del" data-email="'+esc(a.email)+'">삭제</button>')+'</div>').join('')+
      '<div class="row"><input id="al-email" type="email" placeholder="멤버 이메일" style="flex:1;min-width:160px"><button class="btn pri" data-login="add">추가</button></div>'; }
  return h+'</section>'; }

/* ---------- 시작 ---------- */
async function names(ids){ if(!user) return; const want=[...new Set(ids)].filter(i=>i&&/^u_/.test(i)&&!(i in S.names)); if(!want.length) return;
  try{ const ps=await user.profiles(want); want.forEach(i=>{S.names[i]=(ps[i]&&ps[i].name)||'';}); if(db&&S.mloaded&&S.names[S.me]&&!S.mnames[S.me]){ S.mnames[S.me]=S.names[S.me].slice(0,12); db.doc('members/'+S.me).update({name:S.mnames[S.me]}).catch(()=>{}); } render(); }catch(_){} }
async function start(){
  const h=(location.hash||'').slice(1); if(TABS.some(t=>t[0]===h)) S.tab=h;
  try{ const u=localStorage.getItem('use-tab'); if(USES.some(x=>x[0]===u)) S.use=u; }catch(_){ }
  const timer=setTimeout(()=>{ if(!S.ready){S.ready=true;render(true);} },10000);
  let acc=null;
  try{ if(window.PlazaDB){ const ses=await PlazaDB.session(); if(!ses){ clearTimeout(timer); return loginView(); } acc=await PlazaDB.access(); } }catch(e){ clearTimeout(timer); return loginView('연결하지 못했습니다. '+((e&&e.message)||'')); }
  if(!acc){ db=null; S.me='me'; S.members=['me']; S.ready=true; clearTimeout(timer); return render(true); }
  if(!acc.member){ clearTimeout(timer); return loginView('이 이메일('+acc.email+')은 아직 멤버로 등록되지 않았습니다. 관리자에게 이메일 등록을 요청한 뒤 다시 열어 주세요.',true); }
  db=PlazaDB.db; S.admin=!!acc.admin; S.email=acc.email;
  try{ S.me=await whoAmI(acc); }catch(e){ clearTimeout(timer); return loginView('멤버 정보를 읽지 못했습니다. '+((e&&e.message)||''),true); }
  if(!S.me){ clearTimeout(timer); return; }
  S.live=true; names([S.me]);
  db.doc('data/users/'+S.me+'/prefs').get().then(s=>{ if(s.exists){S.prefs=s.data(); db.doc('members/'+S.me).update({regions:S.prefs.regions||'',types:S.prefs.types||[]}).catch(()=>{}); render();} }).catch(()=>{});
  const bad=e=>{ S.err='데이터를 불러오지 못했습니다. 화면을 다시 열어 주세요.'; S.ready=true; render(true); };
  db.collection('props').onSnapshot(s=>{ S.props={}; s.docs.forEach(d=>{S.props[d.id]=d.data();}); names(Object.values(S.props).map(p=>p.createdBy)); S.ready=true; clearTimeout(timer); render(); },bad);
  db.collection('recs').onSnapshot(s=>{ S.recs=s.docs.map(d=>Object.assign({id:d.id},d.data())); render(); },bad);
  db.collection('members').onSnapshot(s=>{ S.members=s.docs.map(d=>d.id); S.mnames={}; s.docs.forEach(d=>{ const n=(d.data()||{}).name; if(n) S.mnames[d.id]=String(n).slice(0,12); }); S.mloaded=true; names(S.members); render(); },bad);
}
render(true); start().then(()=>{ if(!S.gate&&!guideSeen()) guideGo(0); });
})();
</script>
